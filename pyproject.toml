[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-hybrid-cim-block-simulator"
version = "0.1.0"
description = "Operator-level RRAM/SRAM CIM simulation for a ViT Transformer block"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

